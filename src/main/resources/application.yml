server:
  port: 8088

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/car_rental?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.car.rental.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: luxury-car-rental-jwt-secret-key-2024-very-long-secret
  # access token 有效期：2 小时（短期，配合前端无感刷新）
  expiration: 7200000
  # refresh token 有效期：7 天（长期，用于刷新 access token）
  refresh-expiration: 604800000

upload:
  # 上传目录放在用户目录下，避免 Windows 对 C:\ 根目录的写入保护
  path: ${user.home}/car_rental_uploads
  access-path: /uploads/**
  resource-location: file:${user.home}/car_rental_uploads/

logging:
  level:
    com.car.rental: debug